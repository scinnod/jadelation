events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Internal nginx - listens on port 8000 without SSL
    # External nginx proxy manager should connect here
    server {
        listen 8000 default_server;
        listen [::]:8000 default_server;
        server_name "";

        keepalive_timeout 5;
        
        # Static files
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        
        location / {
            proxy_pass http://deepl:8000/;
            include /etc/nginx/proxy_params;
        }
    }

}