# ==============================================================================
# Docker Compose Configuration for DeepL Translation Frontend
# ==============================================================================

services:
  # ============================================================================
  # Nginx Reverse Proxy (Internal)
  # ============================================================================
  # Handles static files and proxies to Django app
  # External nginx proxy manager should connect to http://translation-nginx:8000
  # via the shared 'translation_backend' Docker network
  nginx:
    image: nginx:1.27-alpine
    container_name: translation_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/mime.types:/etc/nginx/mime.types:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
      - staticfiles:/app/staticfiles:ro  # Serve static files
    networks:
      - translation_backend  # External network for nginx proxy manager
      - translation_private
    depends_on:
      - deepl
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================================================
  # DeepL Translation Application
  # ============================================================================
  deepl:
    build:
      context: ./apps/deepl
      dockerfile: Dockerfile
    container_name: translation_app
    volumes:
      # Application code (for development - remove in production)
      # - ./apps/deepl:/app
      
      # Organization-specific content (about texts, logo) can be customized
      # via docker-compose.override.yml - see docker-compose.override.yml.example
      # and overrides/README.md for details.
      
      # Persistent data volumes (managed by Docker)
      # To customize paths, modify these volume mounts:
      - secrets:/secrets                  # Secret key storage (outside app dir)
      - database:/app/data/db             # SQLite database
      - logs:/app/logs                    # Application logs
      - staticfiles:/app/staticfiles      # Static files
    env_file:
      - env/deepl.env
    environment:
      # Override secret key to read from file (stored outside app directory)
      - SECRET_KEY_FILE=/secrets/django_secret_key
      # Gunicorn configuration
      - GUNICORN_WORKERS=3
      - GUNICORN_TIMEOUT=120
      - GUNICORN_LOG_LEVEL=info
    networks:
      - translation_private
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Security options
    security_opt:
      - no-new-privileges:true
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

# ==============================================================================
# Docker Volumes
# ==============================================================================
volumes:
  secrets:
    name: translation_secrets
    driver: local
  database:
    name: translation_database
    driver: local
  logs:
    name: translation_logs
    driver: local
  staticfiles:
    name: translation_staticfiles
    driver: local

# ==============================================================================
# Docker Networks
# ==============================================================================
# Setup instructions:
# 1. Create the external network before starting the stack:
#      docker network create translation_backend
#    (required both for local testing and in production)
# 2. In production, connect your external nginx proxy manager to 'translation_backend'
# 3. Configure upstream to: http://translation-nginx:8000
networks:
  translation_backend:
    external: true  # Shared network - must be created manually before starting
  translation_private:
    name: translation_private
    driver: bridge
    internal: false  # Set to true if app doesn't need internet access
